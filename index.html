<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift Ledger</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-shell">
        <header class="topbar">
            <div>
                <p class="eyebrow">Service ledger</p>
                <h1>Shift Ledger</h1>
            </div>
            <nav class="main-nav" aria-label="Main navigation">
                <button type="button" class="nav-button" data-view="dashboard">Dashboard</button>
                <button type="button" class="nav-button" data-view="new-shift">New Shift</button>
                <button type="button" class="nav-button" data-view="previous-shifts">Previous Shifts</button>
            </nav>
        </header>

        <p id="form-status" class="form-status" role="status" aria-live="polite" hidden></p>

        <main>
            <section id="dashboard" class="view is-visible">
                <div class="summary-grid">
                    <article class="stat-card accent-blue">
                        <span>Total shifts</span>
                        <strong id="summary-total-shifts">0</strong>
                    </article>
                    <article class="stat-card accent-green">
                        <span>Hours worked</span>
                        <strong id="summary-total-hours">0h 0m</strong>
                    </article>
                    <article class="stat-card accent-gold">
                        <span>Total sales</span>
                        <strong id="summary-total-sales">$0.00</strong>
                    </article>
                    <article class="stat-card accent-purple">
                        <span>Net tips</span>
                        <strong id="summary-total-tips">$0.00</strong>
                    </article>
                </div>

                <section class="period-grid" aria-label="Period summaries">
                    <article class="period-card">
                        <div class="period-heading">
                            <div>
                                <p class="eyebrow">Monday to Sunday</p>
                                <h2>This week</h2>
                            </div>
                            <span id="week-date-range" class="period-range"></span>
                        </div>
                        <div id="week-summary" class="period-metrics"></div>
                    </article>
                    <article class="period-card">
                        <div class="period-heading">
                            <div>
                                <p class="eyebrow">Calendar month</p>
                                <h2>This month</h2>
                            </div>
                            <span id="month-date-range" class="period-range"></span>
                        </div>
                        <div id="month-summary" class="period-metrics"></div>
                    </article>
                </section>

                <section class="panel">
                    <div class="panel-header">
                        <h2>Recent activity</h2>
                        <button type="button" class="secondary-button" data-view="previous-shifts">View all</button>
                    </div>
                    <div id="recent-shifts" class="recent-list"></div>
                </section>
            </section>

            <section id="new-shift" class="view is-hidden">
                <div class="panel">
                    <div class="panel-header">
                        <h2 id="form-title">New Shift</h2>
                    </div>

                    <form id="shift-form" novalidate>
                        <fieldset>
                            <legend>General</legend>
                            <div class="form-grid">
                                <label class="field">
                                    <span>Date</span>
                                    <input type="date" id="shift-date" required>
                                </label>
                                <label class="field">
                                    <span>Meal period</span>
                                    <select id="shift-meal-period" required>
                                        <option value="">Select</option>
                                        <option value="Lunch">Lunch</option>
                                        <option value="Dinner">Dinner</option>
                                        <option value="Double">Double</option>
                                    </select>
                                </label>
                                <label class="field">
                                    <span>Job</span>
                                    <select id="shift-job" required>
                                        <option value="">Select</option>
                                        <option value="Server">Server</option>
                                        <option value="Expo">Expo</option>
                                    </select>
                                </label>
                            </div>
                        </fieldset>

                        <fieldset>
                            <legend>Time tracking</legend>
                            <div class="form-grid">
                                <label class="field">
                                    <span>Clock in</span>
                                    <input type="time" id="shift-clock-in" required>
                                </label>
                                <label class="field">
                                    <span>Clock out</span>
                                    <input type="time" id="shift-clock-out" required>
                                </label>
                                <label class="field">
                                    <span>Break start</span>
                                    <input type="time" id="shift-break-start">
                                </label>
                                <label class="field">
                                    <span>Break end</span>
                                    <input type="time" id="shift-break-end">
                                </label>
                            </div>
                        </fieldset>

                        <fieldset>
                            <legend>Sales</legend>
                            <div class="form-grid">
                                <label class="field">
                                    <span>Food</span>
                                    <input type="number" id="shift-food-sales" min="0" step="0.01" value="0">
                                </label>
                                <label class="field">
                                    <span>Beer &amp; wine</span>
                                    <input type="number" id="shift-baw-sales" min="0" step="0.01" value="0">
                                </label>
                                <label class="field">
                                    <span>Liquor</span>
                                    <input type="number" id="shift-liquor-sales" min="0" step="0.01" value="0">
                                </label>
                                <label class="field">
                                    <span>NA beverage</span>
                                    <input type="number" id="shift-na-sales" min="0" step="0.01" value="0">
                                </label>
                                <label class="field">
                                    <span>Additional</span>
                                    <input type="number" id="shift-additional-sales" min="0" step="0.01" value="0">
                                </label>
                            </div>
                        </fieldset>

                        <fieldset>
                            <legend>Tips</legend>
                            <div class="form-grid">
                                <label class="field">
                                    <span>CC tips</span>
                                    <input type="number" id="shift-cc-tips" min="0" step="0.01" value="0">
                                </label>
                                <label class="field">
                                    <span>Cash tips</span>
                                    <input type="number" id="shift-cash-tips" min="0" step="0.01" value="0">
                                </label>
                                <label class="field">
                                    <span>Tips paid out</span>
                                    <input type="number" id="shift-tip-out-paid" min="0" step="0.01" value="0">
                                </label>
                                <label class="field">
                                    <span>Tip out received</span>
                                    <input type="number" id="shift-tip-out-received" min="0" step="0.01" value="0">
                                </label>
                            </div>
                        </fieldset>

                        <label class="field notes-field">
                            <span>Shift notes</span>
                            <textarea id="shift-notes" rows="4" placeholder="Anything important from the shift?"></textarea>
                        </label>

                        <div class="form-actions">
                            <button type="submit" class="primary-button">Save shift</button>
                            <button type="button" id="clear-form" class="secondary-button">Clear</button>
                            <button type="button" id="cancel-form" class="ghost-button">Cancel</button>
                        </div>
                    </form>
                </div>
            </section>

            <section id="previous-shifts" class="view is-hidden">
                <div class="panel">
                    <div class="panel-header panel-header-stack">
                        <h2>Previous shifts</h2>
                        <div class="toolbar">
                            <label class="field inline-field">
                                <span>From</span>
                                <input type="date" id="filter-date-from">
                            </label>
                            <label class="field inline-field">
                                <span>To</span>
                                <input type="date" id="filter-date-to">
                            </label>
                            <label class="field inline-field">
                                <span>Sort</span>
                                <select id="sort-by">
                                    <option value="date-desc">Newest first</option>
                                    <option value="date-asc">Oldest first</option>
                                    <option value="sales-desc">Sales: high to low</option>
                                    <option value="tips-desc">Tips: high to low</option>
                                </select>
                            </label>
                            <label class="field inline-field">
                                <span>Job</span>
                                <select id="filter-job">
                                    <option value="all">All jobs</option>
                                    <option value="Server">Server</option>
                                    <option value="Expo">Expo</option>
                                </select>
                            </label>
                            <button type="button" id="clear-filters" class="ghost-button">Clear filters</button>
                            <button type="button" id="export-csv" class="primary-button">Export CSV</button>
                        </div>
                    </div>

                    <p id="history-status" class="history-status" role="status" aria-live="polite"></p>
                    <div id="shift-list" class="shift-list"></div>
                </div>
            </section>
        </main>
    </div>

    <template id="shift-card-template">
        <article class="shift-card">
            <div class="card-header">
                <div>
                    <p class="card-date"></p>
                    <h3 class="card-title"></h3>
                </div>
                <span class="pill card-meal"></span>
            </div>

            <div class="card-meta">
                <p><strong>Job:</strong> <span class="card-job"></span></p>
                <p><strong>Hours:</strong> <span class="card-hours"></span></p>
            </div>

            <div class="card-metrics">
                <p><strong>Sales:</strong> <span class="card-sales"></span></p>
                <p><strong>Tips:</strong> <span class="card-tips"></span></p>
            </div>

            <div class="card-breakdown">
                <p><strong>Clock in:</strong> <span class="card-clock-in"></span></p>
                <p><strong>Clock out:</strong> <span class="card-clock-out"></span></p>
                <p><strong>Break:</strong> <span class="card-break"></span></p>
            </div>

            <p class="card-notes"></p>

            <div class="card-actions">
                <button type="button" class="edit-shift secondary-button">Edit</button>
                <button type="button" class="delete-shift ghost-button">Delete</button>
            </div>
        </article>
    </template>

    <script src="script.js"></script>
</body>

</html>
